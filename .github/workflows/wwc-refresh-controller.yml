name: WWC refresh controller
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
  actions: write
jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine game days
        id: window
        env:
          WWC_REFRESH_MODE: enable
        run: python wwc_refresh.py
      - name: Enable or disable fast-score workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE: ${{ steps.window.outputs.active }}
          GH_REPO: ${{ github.repository }}
        run: |
          WORKFLOW="repos/$GH_REPO/actions/workflows/wwc-fast-scores.yml"
          STATE=$(gh api "$WORKFLOW" --jq '.state')
          if [ "$ACTIVE" = 'true' ]; then
            if [ "$STATE" != 'active' ]; then
              gh api -X PUT "$WORKFLOW/enable"
            else
              echo "Fast-score workflow already enabled."
            fi
          else
            if [ "$STATE" = 'active' ]; then
              gh api -X PUT "$WORKFLOW/disable"
            else
              echo "Fast-score workflow already inactive."
            fi
          fi
