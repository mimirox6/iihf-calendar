name: Update IIHF calendar
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh official IIHF data
        run: python calendar_feed.py
      - name: Commit changed calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/calendar.ics docs/games.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update IIHF schedule and scores'
            git push
          fi
      - name: Sync to Google Calendar
        if: ${{ env.GOOGLE_CALENDAR_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SYNC_DRY_RUN: ${{ vars.GOOGLE_SYNC_DRY_RUN }}
        run: |
          pip install google-auth
          python google_calendar_sync.py
