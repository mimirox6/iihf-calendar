name: WWC fast scores
on:
  workflow_dispatch:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
permissions:
  contents: write
concurrency:
  group: wwc-google-calendar-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check active game window
        id: window
        env:
          WWC_REFRESH_MODE: poll
        run: python wwc_refresh.py
      - name: Fetch IIHF and sync Google Calendar
        if: steps.window.outputs.active == 'true'
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SYNC_DRY_RUN: ${{ vars.GOOGLE_SYNC_DRY_RUN }}
        run: |
          pip install -r requirements.txt google-auth
          python calendar_feed.py
          python google_calendar_sync.py
      - name: Commit updated schedule
        if: steps.window.outputs.active == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/games.json docs/calendar.ics
          git diff --cached --quiet || (git commit -m 'Refresh WWC live scores' && git push)
