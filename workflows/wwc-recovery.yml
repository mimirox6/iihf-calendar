name: WWC result recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write
concurrency:
  group: wwc-calendar-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check active game window
        id: window
        env:
          WWC_REFRESH_recovery: recovery
        run: python wwc_refresh.py
      - name: Fetch IIHF and sync Google Calendar
        if: steps.window.outputs.active == 'true'
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SYNC_DRY_RUN: ${{ vars.GOOGLE_SYNC_DRY_RUN }}
        run: |
          pip install -r requirements.txt google-auth
          python calendar_feed.py
          python google_calendar_sync.py
          WWC_REFRESH_MODE=mark-success WWC_CHECK_recovery=recovery python wwc_refresh.py
      - name: Commit refreshed data and check history
        if: steps.window.outputs.active == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/games.json docs/calendar.ics docs/wwc_refresh_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh WWC scores and check history'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
